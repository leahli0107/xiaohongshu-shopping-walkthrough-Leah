  --p0: #FF6B80; --p0-bg: #3D1820; --p1: #F2B154; --p1-bg: #36290F; --p2: #A9AFBA; --p2-bg: #2A2C31; --ok: #4CC98C; --ok-bg: #12301F;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --red: #FF4560; --red-ink: #FF6B80; --red-soft: #3A1820;
  --bg: #121113; --surface: #1C1B1E; --surface-2: #222125; --ink: #EEEDF0; --ink-2: #C5C4CA; --muted: #8F8E96; --line: #2E2D32;

<script>
(() => {
  const D = window.WT;
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // internal ids (S-1, PAY-2 …) are never shown: references render as the issue's short name
  const REF = /\b(?:PAY|SH|N|S|P|R|K|O|C)-\d\b/g;
  const nameOf = id => (D.short && D.short[id]) || id;
  const refBtn = id => `<button class="ref" data-issue="${id}">${esc(nameOf(id))}</button>`;
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(REF, m => refBtn(m));
  const plain = s => String(s).replace(REF, m => nameOf(m));
  const rootName = id => (D.rootOf[id] || '').replace(/^[①②③]+\s*/, '');
  const PRI_LABEL = { P0: '高优先级', P1: '中优先级', P2: '低优先级', OK: '亮点' };
  const WIDE = new Set(['image1', 'image2', 'image16', 'ship', 'order29']);

  // index of every issue -> stage
  const ISSUES = {};
  D.stages.forEach(st => st.issues.forEach(i => { ISSUES[i.id] = { ...i, stage: st }; }));
  const all = Object.values(ISSUES);
  const count = (list, p) => list.filter(i => i.pri === p).length;
  const problems = all.filter(i => i.pri !== 'OK');

  const VIEWS = [
    { key: 'overview', label: '核心结论', icon: '◎', group: '总览' },
    { key: 'method', label: '体验方法', icon: '◇', group: '总览' },
    ...D.stages.map(s => ({ key: s.key, label: s.name, group: '购买链路', stage: s })),
    { key: 'priority', label: '优先级', icon: '▤', group: '结论' },
    { key: 'solutions', label: '改进方案', icon: '✦', group: '结论' },
  ];

  // ---------- rail ----------
  function renderRail(active) {

    const groups = [...new Set(VIEWS.map(v => v.group))];
    groups.forEach(g => {
      html += `<div class="nav-group"><div class="nav-label">${g}</div>`;
      VIEWS.filter(v => v.group === g).forEach(v => {
        const cur = v.key === active ? ' aria-current="page"' : '';
        if (v.stage) {
          const p = v.stage.issues.filter(i => i.pri !== 'OK');
          const p0 = count(p, 'P0');
          html += `<button class="nav-item" data-go="${v.key}"${cur}><span class="nav-no">${v.stage.no}</span><span class="nav-name">${v.label}</span><span class="nav-count">${p0 ? '<i class="dot" title="含高优先级问题"></i>' : ''}${p.length}</span></button>`;
        } else {
          html += `<button class="nav-item" data-go="${v.key}"${cur}><span class="nav-icon">${v.icon}</span><span class="nav-name">${v.label}</span></button>`;
        }
      });
      html += `</div>`;
    });
    $('#rail').innerHTML = html;
    const a = $('#rail [aria-current="page"]');
    if (a && window.matchMedia('(max-width: 820px)').matches) a.scrollIntoView({ block: 'nearest', inline: 'center' });
  }

  // ---------- pieces ----------
  const tag = p => `<span class="tag t-${p}">${PRI_LABEL[p]}</span>`;
  const idlink = id => `<button class="idlink" data-issue="${id}">${esc(nameOf(id))}</button>`;
  function pic([name, cap]) {
    const c = esc(plain(cap));
    return `<figure class="pic${WIDE.has(name) ? ' wide' : ''}" style="margin:0"><button data-zoom="${name}.jpg" data-cap="${c}" aria-label="放大截图"><img src="${name}.jpg" alt="${c}" loading="lazy"></button><figcaption>${c}</figcaption></figure>`;
  }
  function card(i) {
    const f = (k, v, cls = '') => v ? `<div class="f ${cls}"><div class="k">${k}</div><div class="v">${md(v)}</div></div>` : '';
    const see = i.seeId ? `<div class="f"><div class="k">截图</div><div class="v">${md(i.see)}</div></div>` : '';
    const pics = i.pics ? `<div class="pics n${i.pics.length}">${i.pics.map(pic).join('')}</div>` : '';
    return `<article class="card" id="card-${i.id}" data-pri="${i.pri}">
      <div class="card-h"><h3>${esc(i.title)}</h3>${tag(i.pri)}</div>
      <div class="card-b${pics ? ' has-pics' : ''}"><div class="fields">
        ${f(i.pri === 'OK' ? '做得好' : '现象', i.what)}${f('影响', i.impact)}${f('用户预期', i.expect)}${f('建议', i.fix, 'fix')}${see}
      </div>${pics}</div></article>`;
  }
  function stageBar(st) {
    const n = st.issues.length;
    const seg = p => { const c = count(st.issues, p); return c ? `<i class="b${p === 'OK' ? 'ok' : p.slice(1)}" style="width:${c / n * 100}%"></i>` : ''; };
    return `<div class="bar">${seg('P0')}${seg('P1')}${seg('P2')}${seg('OK')}</div>`;
  }

  // ---------- views ----------
  function vOverview() {
    const p0 = problems.filter(i => i.pri === 'P0');
    return `
    <section class="hero">
      <div><div class="eyebrow">PRODUCT TEARDOWN</div>
        <h1>一个纽约用户，在小红书<em>买东西</em>会卡在哪</h1>
        <p>我用英文系统、美区账号和曼哈顿地址，从打开 App 一路走到退款找客服，记录每一步的体验断点，并用 Amazon 做对照。</p></div>
      <dl class="meta">
        <dt>姓名</dt><dd>${esc(D.meta.name)}</dd>
        <dt>体验日期</dt><dd>${esc(D.meta.date)}</dd><dt>设备</dt><dd>${esc(D.meta.device)}</dd><dt>收货地址</dt><dd>${esc(D.meta.address)}</dd></dl>
      <div class="stats">
        <div class="stat"><b>${problems.length}</b><span>体验问题</span></div>
        <div class="stat s0"><b>${count(all, 'P0')}</b><span>高优先级</span></div>
        <div class="stat s1"><b>${count(all, 'P1')}</b><span>中优先级</span></div>
        <div class="stat s2"><b>${count(all, 'P2')}</b><span>低优先级</span></div>
        <div class="stat sok"><b>${count(all, 'OK')}</b><span>做得好的地方</span></div>
      </div>
    </section>
    <section class="panel"><h2>购买链路上，问题集中在哪里</h2>
      <div class="journey"><div class="jtrack">${D.stages.map(st => {
        const p = st.issues.filter(i => i.pri !== 'OK');
        return `<button class="jnode" data-go="${st.key}"><span class="n">阶段 ${st.no}</span><span class="t">${esc(st.name)}</span>${stageBar(st)}<span class="c">${p.length} 个问题${count(p, 'P0') ? ` · <b style="color:var(--p0)">${count(p, 'P0')} 个高优先级</b>` : ''}</span></button>`;
      }).join('')}</div></div>
      <div class="legend"><span><i class="b0"></i>高优先级</span><span><i class="b1"></i>中优先级</span><span><i class="b2"></i>低优先级</span><span><i class="bok"></i>亮点</span><span>点击任一阶段查看详情</span></div>
    </section>
    <section><div class="roots">${D.roots.map(r => `<div class="root"><div class="rn">${r.n}</div><h3>${esc(r.t)}</h3><p>${md(r.d)}</p></div>`).join('')}</div></section>
    <section class="panel"><h2>最优先解决的 ${p0.length} 个问题</h2><div class="tw"><table>
      <thead><tr><th>问题</th><th>环节</th><th>根因</th></tr></thead>
      <tbody>${p0.map(i => `<tr class="click" data-issue="${i.id}"><td><b>${esc(i.title)}</b></td><td class="muted" style="white-space:nowrap">${esc(i.stage.name)}</td><td class="muted" style="white-space:nowrap">${esc(rootName(i.id))}</td></tr>`).join('')}</tbody></table></div></section>`;
  }

  function vMethod() {
    return `
    <header class="vh"><div class="eyebrow">METHOD</div><h1>体验方法</h1><div class="sub">怎样尽量接近一个真实的美国用户</div></header>
    <section class="panel"><h2>体验设置</h2><div class="tw"><table><thead><tr><th>设置</th><th>我的做法</th><th>为什么这样做</th></tr></thead>
      <tbody>${D.setup.map(r => `<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td class="muted">${esc(r[2])}</td></tr>`).join('')}</tbody></table></div></section>
    <section class="panel"><h2>怎么读这份走查</h2>
      <div class="howto"><span><span class="box-r"></span>红框：问题位置</span><span><span class="box-g"></span>绿框：做得好的地方或对标做法</span><span>框上的数字对应图下说明</span><span>点击截图可放大</span></div>
      <p class="muted" style="margin:12px 0 0">每个问题写清现象、用户预期和建议；优先级按「是否阻断下单 × 影响多少用户 × 改动成本」判断。问题之间互相引用时，点名称可以跳过去。</p></section>`;
  }

  let filter = 'all';
  function vStage(st) {
    const idx = D.stages.indexOf(st);
    const prev = D.stages[idx - 1], next = D.stages[idx + 1];
    const p = st.issues.filter(i => i.pri !== 'OK');
    const ok = count(st.issues, 'OK');
    const list = st.issues.filter(i => filter === 'all' || (filter === 'ok' ? i.pri === 'OK' : i.pri !== 'OK'));
    return `
    <header class="vh"><div class="eyebrow">阶段 ${st.no} / 8</div><h1>${esc(st.name)}</h1><div class="sub">${esc(st.sub)}</div></header>
    <div class="chips"><span class="chip">${p.length} 个问题</span>${['P0', 'P1', 'P2'].map(x => count(p, x) ? `<span class="chip">${tag(x)} × ${count(p, x)}</span>` : '').join('')}${ok ? `<span class="chip">${tag('OK')} × ${ok}</span>` : ''}</div>
    <section class="feel"><div class="q">“</div><div><div class="lbl">体验感受</div><p>${md(st.feel)}</p></div></section>
    ${st.scene ? `<div class="scene">场景：${esc(st.scene)}</div>` : ''}
    <div class="filters" role="group" aria-label="筛选">
      ${[['all', '全部'], ['issue', '问题'], ['ok', '亮点']].map(([k, l]) => `<button class="fbtn" data-filter="${k}" aria-pressed="${filter === k}">${l}</button>`).join('')}
    </div>
    ${list.map(card).join('') || '<div class="panel muted">这个阶段没有这类内容。</div>'}
    <nav class="pager">${prev ? `<button class="pbtn" data-go="${prev.key}"><small>上一阶段</small>← ${prev.no} ${esc(prev.name)}</button>` : '<span></span>'}
      ${next ? `<button class="pbtn" data-go="${next.key}" style="text-align:right"><small>下一阶段</small>${next.no} ${esc(next.name)} →</button>` : `<button class="pbtn" data-go="priority" style="text-align:right"><small>下一步</small>优先级 →</button>`}</nav>`;
  }

  function vPriority() {
    const order = { P0: 0, P1: 1, P2: 2 };
    const sorted = problems.slice().sort((a, b) => order[a.pri] - order[b.pri]);
    const mx = (cls, title, ids) => `<div class="mx ${cls}"><b>${title}</b><div class="chips">${ids.map(idlink).join('')}</div></div>`;
    return `
    <header class="vh"><div class="eyebrow">PRIORITY</div><h1>问题汇总与优先级</h1><div class="sub">${problems.length} 个问题，按「是否阻断下单 × 影响多少用户 × 改动成本」排序</div></header>
    <section class="panel"><h2>判断规则</h2><div class="tw"><table><tbody>${D.rules.map(r => `<tr><td style="width:96px">${tag(r[0])}</td><td>${esc(r[1])}</td><td class="muted" style="white-space:nowrap">${count(all, r[0])} 个</td></tr>`).join('')}</tbody></table></div></section>
    <section class="panel"><h2>影响 × 成本</h2><p class="muted" style="margin:-4px 0 14px">同一优先级内，先做影响大、改动小的。点名称可跳到对应问题。</p>
      <div class="matrix">
        <span></span><div class="mx-h">改动小</div><div class="mx-h">改动大</div>
        <div class="mx-h">影响大</div>${mx('mx-now', '立即做', D.matrix.now)}${mx('mx-plan', '规划做', D.matrix.plan)}
        <div class="mx-h">影响小</div>${mx('mx-quick', '顺手做', D.matrix.quick)}${mx('mx-watch', '观察', D.matrix.watch)}
      </div></section>
    <section class="panel"><h2>全部问题</h2><div class="tw"><table>
      <thead><tr><th>问题</th><th>环节</th><th>根因</th><th>优先级</th></tr></thead>
      <tbody>${sorted.map(i => `<tr class="click" data-issue="${i.id}"><td>${esc(i.title)}</td><td class="muted" style="white-space:nowrap">${esc(i.stage.name)}</td><td class="muted" style="white-space:nowrap">${esc(rootName(i.id))}</td><td>${tag(i.pri)}</td></tr>`).join('')}</tbody></table></div></section>`;
  }

  function vSolutions() {
    const nums = ['方案一', '方案二', '方案三', '方案四', '方案五'];
    return `
    <header class="vh"><div class="eyebrow">SOLUTIONS</div><h1>最想优先推动的五项改进</h1><div class="sub">前三项解决"买不下去、不敢付钱、出了问题没法沟通"，后两项解决"找不到、看不懂"</div></header>
    ${D.solutions.map((s, k) => `<section class="sol"><div class="sol-h"><span class="sol-n">${nums[k]}</span><h2>${esc(s.t)}</h2></div>
      <div class="chips"><span class="muted" style="font-size:13px">解决：</span>${s.fixes.map(idlink).join('')}</div>
      <ol>${s.steps.map(x => `<li>${md(x)}</li>`).join('')}</ol>
      <div class="metric"><b>衡量指标　</b>${esc(s.metrics)}</div></section>`).join('')}`;
  }

  // ---------- routing ----------
  let current = null;
  function render(key, focusId) {
    const v = VIEWS.find(x => x.key === key) || VIEWS[0];
    if (v.key !== current) filter = 'all';
    current = v.key;
    renderRail(v.key);
    const html = v.stage ? vStage(v.stage) : ({ overview: vOverview, method: vMethod, priority: vPriority, solutions: vSolutions })[v.key]();
    $('#main').innerHTML = `<div class="view">${html}</div>`;
    if (focusId) {
      const el = document.getElementById('card-' + focusId);
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 1600); }
    } else window.scrollTo(0, 0);
  }
  function go(key, focusId) {
    if (location.hash.slice(1) === key) render(key, focusId);
    else { pendingFocus = focusId; location.hash = key; }
  }
  let pendingFocus = null;
  window.addEventListener('hashchange', () => { render(location.hash.slice(1), pendingFocus); pendingFocus = null; });

  document.addEventListener('click', e => {
    const t = e.target.closest('[data-go],[data-issue],[data-zoom],[data-filter]');
    if (!t) return;
    if (t.dataset.zoom) { openLb(t.dataset.zoom, t.dataset.cap); return; }
    if (t.dataset.filter) { filter = t.dataset.filter; render(current); return; }
    if (t.dataset.issue) { const i = ISSUES[t.dataset.issue]; if (i) { filter = 'all'; go(i.stage.key, i.id); } return; }
    if (t.dataset.go) go(t.dataset.go);
  });

  // ---------- lightbox ----------
  const lb = $('#lb');
  function openLb(src, cap) { $('#lbimg').src = src; $('#lbimg').alt = cap; $('#lbcap').textContent = cap; lb.hidden = false; $('#lbx').focus(); }
  function closeLb() { lb.hidden = true; }
  lb.addEventListener('click', e => { if (e.target === lb || e.target.id === 'lbx') closeLb(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !lb.hidden) closeLb(); });

  render(location.hash.slice(1));
})();
</script>


</body></html>
